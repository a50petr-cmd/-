name = "alekseev-job-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 06:00 UTC = 09:00 Москва, понедельник–пятница.
[triggers]
crons = ["0 6 * * 1-5"]

# id подставляется после `npm run kv`.
[[kv_namespaces]]
binding = "JOBS"
id = "replace-with-kv-namespace-id"

[vars]
DIGEST_LIMIT = "5"
SEARCH_PERIOD_DAYS = "14"
MIN_SCORE = "78"
